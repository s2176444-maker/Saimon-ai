
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>SEMYON AI</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#080808;--panel:#101010;--card:#151515;
 --border:#292929;--text:#f5f5f5;--muted:#858585;
 --accent:#dedede;
}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 height:100dvh;overflow:hidden;
}
button{font:inherit}
.app{display:flex;height:100dvh}
.sidebar{
 width:265px;background:#0c0c0c;border-right:1px solid var(--border);
 padding:23px 18px;display:flex;flex-direction:column;
}
.logo{font-size:22px;font-weight:800;letter-spacing:2px}
.logo span{color:#777}
.logo-sub{font-size:10px;letter-spacing:3px;color:#777;margin-top:5px}
.new{
 margin-top:32px;padding:14px;background:#181818;
 border:1px solid #303030;color:white;border-radius:12px;
 cursor:pointer;text-align:left;transition:.2s;
}
.new:hover{background:#242424;border-color:#555}
.history-title{
 margin-top:35px;font-size:10px;letter-spacing:2px;
 color:#656565;text-transform:uppercase;
}
.history-item{
 margin-top:13px;padding:10px;color:#aaa;
 font-size:13px;border-radius:8px;cursor:pointer;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.history-item:hover{background:#1a1a1a}
.side-bottom{margin-top:auto;color:#777;font-size:12px}
.profile{
 display:flex;align-items:center;gap:10px;
 padding-top:17px;border-top:1px solid var(--border);
}
.avatar{
 width:34px;height:34px;border-radius:50%;
 background:linear-gradient(145deg,#555,#171717);
 display:grid;place-items:center;font-weight:bold;
}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
 height:68px;display:flex;align-items:center;
 justify-content:space-between;padding:0 28px;
 border-bottom:1px solid var(--border);
}
.top-name{font-weight:650;letter-spacing:1px}
.status{font-size:11px;color:#999;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#aaa}
.chat{
 flex:1;overflow-y:auto;padding:35px 18px;
 display:flex;flex-direction:column;align-items:center;
 scrollbar-width:thin;scrollbar-color:#333 transparent;
}
.welcome{
 margin:auto;text-align:center;width:min(620px,100%);
 animation:appear .7s ease;
}
.symbol{
 width:66px;height:66px;border-radius:21px;
 margin:0 auto 27px;border:1px solid #353535;
 background:linear-gradient(145deg,#242424,#101010);
 display:grid;place-items:center;font-size:27px;
 box-shadow:0 12px 50px #000;
}
.welcome h1{font-size:clamp(30px,5vw,49px);letter-spacing:-2px;margin:0}
.welcome h1 span{color:#888}
.welcome p{color:#858585;line-height:1.7;margin:15px auto 35px}
.suggestions{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;
 text-align:left;
}
.suggestion{
 background:#111;border:1px solid #292929;
 padding:17px;border-radius:13px;color:#eee;
 cursor:pointer;transition:.25s;
}
.suggestion:hover{
 background:#1c1c1c;border-color:#666;
 transform:translateY(-2px);
}
.suggestion strong{display:block;font-size:13px;margin-bottom:7px}
.suggestion small{color:#777;font-size:12px}
.message{
 width:min(720px,100%);padding:16px 19px;
 border-radius:15px;margin:10px 0;line-height:1.65;
 white-space:pre-wrap;overflow-wrap:anywhere;
 animation:appear .3s ease;
}
.user{
 background:#202020;border:1px solid #303030;
 align-self:flex-end;
}
.bot{
 background:#111;border:1px solid #282828;
 align-self:flex-start;
}
.bot-label{
 color:#aaa;font-size:11px;letter-spacing:1px;
 margin-bottom:8px;font-weight:bold;
}
.bottom{padding:12px 18px 22px}
.input-wrap{
 width:min(760px,100%);margin:auto;
 display:flex;align-items:center;gap:10px;
 background:#111;border:1px solid #333;
 padding:8px 9px 8px 17px;border-radius:17px;
 transition:.2s;
}
.input-wrap:focus-within{
 border-color:#777;box-shadow:0 0 25px #ffffff08;
}
input{
 flex:1;min-width:0;background:transparent;
 border:0;outline:0;color:white;font-size:15px;
 padding:11px 0;
}
input::placeholder{color:#666}
.send{
 width:43px;height:43px;border:0;border-radius:12px;
 background:#e7e7e7;color:#111;font-size:20px;
 cursor:pointer;transition:.2s;
}
.send:hover{background:white;transform:scale(1.04)}
.note{
 text-align:center;color:#555;font-size:10px;
 margin-top:13px;letter-spacing:.5px;
}
@keyframes appear{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:translateY(0)}
}
@media(max-width:650px){
 .sidebar{display:none}
 .topbar{height:58px;padding:0 17px}
 .chat{padding:20px 13px}
 .welcome h1{letter-spacing:-1px}
 .suggestions{grid-template-columns:1fr}
 .suggestion{padding:14px}
 .bottom{padding:10px 12px 17px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div>
   <div class="logo">SEMYON <span>AI</span></div>
   <div class="logo-sub">INTELLIGENCE SYSTEM</div>
  </div>

  <button class="new" onclick="newChat()">＋ &nbsp; Новый чат</button>

  <div class="history-title">История</div>
  <div id="history"></div>

  <div class="side-bottom">
   <div class="profile">
    <div class="avatar">S</div>
    <div>
     <div style="color:#eee;font-weight:bold">Пользователь</div>
     <div style="margin-top:4px">SEMYON AI 2.0</div>
    </div>
   </div>
  </div>
 </aside>

 <main class="main">
  <header class="topbar">
   <div class="top-name">SEMYON <span style="color:#777">AI</span></div>
   <div class="status"><span class="dot"></span> SYSTEM READY</div>
  </header>

  <section class="chat" id="chat">
   <div class="welcome" id="welcome">
    <div class="symbol">✦</div>
    <h1>Добро пожаловать в <span>SEMYON AI</span></h1>
    <p>Искусственный интеллект нового поколения.<br>
    Идеи, знания и возможности — в одном месте.</p>

    <div class="suggestions">
     <button class="suggestion" onclick="choose('Помоги мне с учёбой')">
      <strong>✧ Образование</strong>
      <small>Разбирай сложные темы</small>
     </button>
     <button class="suggestion" onclick="choose('Придумай идею для игры')">
      <strong>◈ Творчество</strong>
      <small>Создавай новые идеи</small>
     </button>
     <button class="suggestion" onclick="choose('Помоги написать программу')">
      <strong>⌘ Программирование</strong>
      <small>Создавай проекты и код</small>
     </button>
     <button class="suggestion" onclick="choose('Расскажи интересный факт')">
      <strong>✦ Интересные знания</strong>
      <small>Открывай новое каждый день</small>
     </button>
    </div>
   </div>
  </section>

  <footer class="bottom">
   <div class="input-wrap">
    <input id="input" placeholder="Спросите что-нибудь..." 
     autocomplete="off"
     onkeydown="if(event.key==='Enter')send()">
    <button class="send" onclick="send()">↑</button>
   </div>
   <div class="note">SEMYON AI · YOUR PERSONAL INTELLIGENCE</div>
  </footer>
 </main>
</div>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const historyBox=document.getElementById('history');

let conversations=[];
let current=[];

function addMessage(text,who){
 const welcome=document.getElementById('welcome');
 if(welcome)welcome.remove();

 const div=document.createElement('div');
 div.className='message '+who;

 if(who==='bot'){
  const label=document.createElement('div');
  label.className='bot-label';
  label.textContent='✦ SEMYON AI';
  div.appendChild(label);
 }
 const content=document.createElement('div');
 content.textContent=text;
 div.appendChild(content);

 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function send(){
 const text=input.value.trim();
 if(!text)return;

 current.push({text,who:'user'});
 addMessage(text,'user');
 input.value='';

 const answer='Это демонстрационная версия SEMYON AI. Интерфейс уже готов! Следующий этап — подключение настоящего искусственного интеллекта.';
 current.push({text:answer,who:'bot'});
 addMessage(answer,'bot');
 updateHistory();
}

function choose(text){
 input.value=text;
 send();
}

function updateHistory(){
 historyBox.innerHTML='';
 conversations.unshift(current.slice());
 conversations=conversations.slice(0,10);

 conversations.forEach((messages)=>{
  const item=document.createElement('div');
  item.className='history-item';
  item.textContent=messages[0]?.text || 'Новый чат';
  item.onclick=()=>loadConversation(messages);
  historyBox.appendChild(item);
 });
}

function loadConversation(messages){
 current=messages.slice();
 chat.innerHTML='';
 messages.forEach(m=>addMessage(m.text,m.who));
}

function newChat(){
 if(current.length && !conversations.some(c=>c===current)){
  conversations.unshift(current.slice());
 }
 current=[];
 chat.innerHTML=`
 <div class="welcome" id="welcome">
  <div class="symbol">✦</div>
  <h1>Снова <span>SEMYON AI</span></h1>
  <p>О чём поговорим сегодня?</p>
 </div>`;
}

</script>
</body>
</html>
