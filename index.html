
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMYON AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b12;color:#f4f5fa;
 font-family:Arial,sans-serif;height:100vh;overflow:hidden
}
.app{display:flex;height:100vh}
.sidebar{
 width:260px;background:#10131d;border-right:1px solid #252a39;
 padding:20px;display:flex;flex-direction:column
}
.logo{font-size:24px;font-weight:bold;margin-bottom:30px}
.logo span{color:#8b7cff}
.new{
 background:#252a3b;border:1px solid #393f55;color:white;
 padding:13px;border-radius:12px;text-align:left;font-size:15px;
 cursor:pointer
}
.side-bottom{margin-top:auto;color:#9299ac;font-size:13px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{
 height:65px;border-bottom:1px solid #252a39;
 display:flex;align-items:center;padding:0 22px;
 font-weight:bold;font-size:17px
}
.chat{
 flex:1;overflow-y:auto;padding:25px 16px;
 display:flex;flex-direction:column;align-items:center
}
.welcome{margin:auto;text-align:center;max-width:550px}
.welcome h1{font-size:38px;margin-bottom:10px}
.welcome h1 span{color:#9385ff}
.welcome p{color:#9ba2b6;line-height:1.6}
.suggestions{
 display:grid;grid-template-columns:1fr 1fr;gap:10px;
 margin-top:28px
}
.suggestion{
 background:#151a27;border:1px solid #2b3143;
 padding:15px;border-radius:14px;color:#dfe2ee;
 cursor:pointer;text-align:left
}
.suggestion:hover{border-color:#8878ff}
.message{
 width:min(720px,100%);padding:15px 18px;
 border-radius:16px;margin:10px 0;line-height:1.6;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.user{background:#292543;align-self:flex-end}
.bot{background:#151a27;align-self:flex-start}
.bottom{padding:12px 16px 20px}
.input-wrap{
 max-width:760px;margin:auto;display:flex;gap:10px;
 background:#171b28;border:1px solid #343b50;
 padding:9px;border-radius:17px
}
input{
 flex:1;min-width:0;background:transparent;border:0;
 outline:0;color:white;font-size:16px;padding:10px
}
.send{
 background:#8878ff;color:white;border:0;border-radius:12px;
 width:45px;font-size:20px;cursor:pointer
}
.note{text-align:center;color:#777f94;font-size:11px;margin-top:10px}
@media(max-width:600px){
 .sidebar{display:none}
 .welcome h1{font-size:31px}
 .suggestions{grid-template-columns:1fr}
 .chat{padding:18px 12px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="logo">SEMYON <span>AI</span></div>
  <button class="new" onclick="newChat()">＋ Новый чат</button>
  <div class="side-bottom">SEMYON AI<br>Версия 1.0</div>
 </aside>

 <main class="main">
  <header class="top">SEMYON AI <span style="color:#8b7cff;margin-left:7px">●</span></header>
  <section class="chat" id="chat">
   <div class="welcome" id="welcome">
    <h1>Привет! Я <span>SEMYON AI</span></h1>
    <p>Твой персональный ИИ-помощник.<br>Скоро здесь можно будет задавать вопросы и общаться с искусственным интеллектом.</p>
    <div class="suggestions">
     <button class="suggestion" onclick="choose('Помоги с учёбой')">📚 Помощь с учёбой</button>
     <button class="suggestion" onclick="choose('Расскажи интересный факт')">💡 Интересный факт</button>
     <button class="suggestion" onclick="choose('Помоги написать программу')">💻 Написать программу</button>
     <button class="suggestion" onclick="choose('Придумай идею для игры')">🎮 Идея для игры</button>
    </div>
   </div>
  </section>
  <footer class="bottom">
   <div class="input-wrap">
    <input id="input" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter')send()">
    <button class="send" onclick="send()">➤</button>
   </div>
   <div class="note">SEMYON AI · Первый прототип</div>
  </footer>
 </main>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');

function addMessage(text,who){
 const welcome=document.getElementById('welcome');
 if(welcome)welcome.remove();
 const div=document.createElement('div');
 div.className='message '+who;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}
function send(){
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,'user');
 input.value='';
 addMessage('Я пока работаю в демонстрационном режиме. Подключение настоящего ИИ сделаем следующим этапом!','bot');
}
function choose(text){
 input.value=text;
 send();
}
function newChat(){
 chat.innerHTML='';
 const div=document.createElement('div');
 div.className='welcome';
 div.id='welcome';
 div.innerHTML='<h1>Привет! Я <span>SEMYON AI</span></h1><p>Твой персональный ИИ-помощник.</p>';
 chat.appendChild(div);
}
</script>
</body>
</html>
